[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-character-recognition"
version = "1.0.0"
description = "Thai Character Recognition using Transfer Learning (ResNet50, EfficientNet-B3, MobileNetV3)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.62.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
gpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "cuda-python>=11.8",
]

[tool.setuptools]
packages = ["src"]